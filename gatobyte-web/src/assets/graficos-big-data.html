<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario de activos de Big Data</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f3f3;--card:#fff;--tx:#2b2b2b;--mu:#6b6b6b;--bd:#dcdcdc;--grid:#e8e8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1f22;--card:#292c30;--tx:#ececec;--mu:#a2a2a2;--bd:#3d4146;--grid:#383c41;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1f22;--card:#292c30;--tx:#ececec;--mu:#a2a2a2;--bd:#3d4146;--grid:#383c41;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI","Helvetica Neue",Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0;font-weight:600}header p{margin:2px 0 0;color:var(--mu);font-size:12px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:3px;cursor:pointer}button:focus-visible{outline:2px solid #4e79a7}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 20px;min-height:44px;align-items:center;color:var(--mu);font-size:12px}
.chip{background:#4e79a7;color:#fff;border-radius:12px;padding:2px 10px;font-size:12px}
main{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;padding:0 20px 20px}
.k{grid-column:span 3;background:var(--card);border:1px solid var(--bd);padding:12px 16px}.k b{display:block;font-size:30px;font-weight:300}.k span{color:var(--mu);font-size:12px}
.c{background:var(--card);border:1px solid var(--bd);padding:12px 14px;grid-column:span 4;min-width:0}.c.w6{grid-column:span 6}.c.w8{grid-column:span 8}
.c h2{font-size:13px;font-weight:600;margin:0 0 8px}.box{position:relative;height:250px}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:7px 6px;text-align:center}th{font-weight:600;color:var(--mu)}td:first-child,th:first-child{text-align:left}
.sc{overflow-x:auto}
@media(max-width:900px){.k{grid-column:span 6}.c,.c.w6,.c.w8{grid-column:span 12}}
</style></head><body>
<header><div><h1>Inventario de activos de Big Data en salud</h1><p>Haz clic en una barra o sección para filtrar todo el tablero</p></div><button id="rst">Quitar filtros</button></header>
<div id="chips"></div>
<main>
<div class="k"><b id="k1"></b><span>Activos</span></div><div class="k"><b id="k2"></b><span>Con datos PHI</span></div>
<div class="k"><b id="k3"></b><span>Activos en uso</span></div><div class="k"><b id="k4"></b><span>Obsoletos</span></div>
<div class="c"><h2>Activos por tipo</h2><div class="box"><canvas id="ct"></canvas></div></div>
<div class="c"><h2>Clasificación de sensibilidad</h2><div class="box"><canvas id="cs"></canvas></div></div>
<div class="c"><h2>Estado</h2><div class="box"><canvas id="ce"></canvas></div></div>
<div class="c w6"><h2>Activos por responsable</h2><div class="box"><canvas id="co"></canvas></div></div>
<div class="c w6"><h2>Año de creación, por tipo</h2><div class="box"><canvas id="cy"></canvas></div></div>
<div class="c w6"><h2>Tipo de activo por sensibilidad</h2><div class="sc" id="hm"></div></div>
</main>
<script>

,"Equipo de BI",2024],["Pipeline ETL","Interna","Activo","Equipo de Data Engineering",2023],["Dataset","PHI","Activo","Equipo de Data Engineering",2024],["Tabla","Interna","Activo","Equipo de BI",2024],["Dashboard","Confidencial","Activo","Dirección de Analítica Clínica",2026],["Dashboard","Interna","En revisión","Equipo de BI",2023],["Dashboard","Interna","Obsoleto","Dirección de Analítica Clínica",2024],["Modelo ML","PHI","Activo","Equipo de Ciencia de Datos",2025],["Dataset","Confidencial","Activo","Gobierno de Datos",2022],["Tabla","PHI","Activo","Gobierno de Datos",2026],["Pipeline ETL","Confidencial","En revisión","Equipo de IoT Médico",2026],["Tabla","Interna","Activo","Equipo de Data Engineering",2023],["Tabla","PHI","Activo","Equipo de BI",2023],["Dataset","PHI","Activo","Equipo de Data Engineering",2025],["Tabla","PHI","Activo","Equipo de BI",2022],["Modelo ML","PHI","Activo","Inteligencia Epidemiológica",2022],["Pipeline ETL","Confidencial","Activo","Equipo de Data Engineering",2023],["Dataset","Interna","Activo","Equipo de Data Engineering",2026],["Dashboard","Confidencial","Activo","Dirección de Analítica Clínica",2023],["Dashboard","Interna","Activo","Inteligencia Epidemiológica",2025],["Dataset","Confidencial","Obsoleto","Gobierno de Datos",2023],["Dashboard","Confidencial","Obsoleto","Inteligencia Epidemiológica",2023],["Modelo ML","Interna","Activo","Equipo de ML Engineering",2025],["Pipeline ETL","Confidencial","Activo","Equipo de Integración HL7/FHIR",2024],["Tabla","Confidencial","Activo","Gobierno de Datos",2023],["Dashboard","Interna","Activo","Inteligencia Epidemiológica",2022],["Pipeline ETL","PHI","Activo","Equipo de Integración HL7/FHIR",2026],["Tabla","Pública","En revisión","Gobierno de Datos",2023],["Pipeline ETL","PHI","Obsoleto","Equipo de IoT Médico",2023],["Dataset","Confidencial","Obsoleto","Dirección de Analítica Clínica",2022],["Tabla","Confidencial","Activo","Gobierno de Datos",2023],["Tabla","Interna","Obsoleto","Gobierno de Datos",2023],["Dataset","Interna","Activo","Equipo de Data Engineering",2024],["Tabla","PHI","En revisión","Equipo de Data Engineering",2025],["Dataset","Interna","Activo","Gobierno de Datos",2022],["Dashboard","Interna","En revisión","Equipo de BI",2026],["Modelo ML","PHI","Activo","Inteligencia Epidemiológica",2023],["Modelo ML","Confidencial","Activo","Equipo de ML Engineering",2023],["Tabla","Confidencial","Activo","Equipo de Data Engineering",2023],["Tabla","Confidencial","Activo","Equipo de BI",2024],["Modelo ML","PHI","Activo","Inteligencia Epidemiológica",2026],["Tabla","Confidencial","Activo","Equipo de Data Engineering",2022],["Dashboard","Interna","Activo","Equipo de BI",2023],["Dashboard","Confidencial","Obsoleto","Equipo de BI",2024],["Dataset","PHI","Activo","Dirección de Analítica Clínica",2023],["Modelo ML","PHI","Activo","Equipo de ML Engineering",2025],["Dataset","Confidencial","En revisión","Dirección de Analítica Clínica",2026],["Tabla","PHI","Activo","Equipo de Data Engineering",2022],["Dataset","Pública","Obsoleto","Dirección de Analítica Clínica",2024],["Dataset","Confidencial","Activo","Gobierno de Datos",2024],["Pipeline ETL","Pública","Activo","Equipo de Data Engineering",2026],["Dataset","PHI","Activo","Equipo de Data Engineering",2025],["Tabla","Interna","Obsoleto","Gobierno de Datos",2024],["Modelo ML","PHI","Activo","Equipo de Ciencia de Datos",2024],["Pipeline ETL","Interna","Activo","Equipo de IoT Médico",2024],["Pipeline ETL","PHI","Activo","Equipo de IoT Médico",2022],["Pipeline ETL","Interna","Activo","Equipo de Integración HL7/FHIR",2023],["Pipeline ETL","Pública","Activo","Equipo de Data Engineering",2023],["Modelo ML","Confidencial","Obsoleto","Equipo de Ciencia de Datos",2023],["Pipeline ETL","PHI","En revisión","Equipo de Integración HL7/FHIR",2025],["Pipeline ETL","PHI","Activo","Equipo de Data Engineering",2026],["Pipeline ETL","Interna","Activo","Equipo de Integración HL7/FHIR",2022],["Tabla","PHI","Activo","Equipo de Data Engineering",2022],["Dataset","Confidencial","Activo","Equipo de Data Engineering",2025],["Dashboard","Confidencial","Activo","Equipo de BI",2023],["Pipeline ETL","Confidencial","Activo","Equipo de Data Engineering",2023],["Pipeline ETL","Confidencial","Obsoleto","Equipo de Integración HL7/FHIR",2024],["Tabla","Confidencial","Activo","Equipo de BI",2023],["Dataset","PHI","Activo","Gobierno de Datos",2024]];
const DIM={t:0,s:1,e:2,o:3,y:4};
const T=["Dataset","Tabla","Pipeline ETL","Dashboard","Modelo ML"],S=["PHI","Confidencial","Interna","Pública"],E=["Activo","En revisión","Obsoleto"],Y=[2022,2023,2024,2025,2026];
const O=[...new Set(D.map(r=>r[3]))].sort((a,b)=>D.filter(r=>r[3]==b).length-D.filter(r=>r[3]==a).length);
const CT=["#4e79a7","#f28e2b","#76b7b2","#b07aa1","#edc948"],CS=["#e15759","#f28e2b","#4e79a7","#59a14f"],CE=["#59a14f","#edc948","#bab0ac"];
const F={t:new Set(),s:new Set(),e:new Set(),o:new Set(),y:new Set()};
const NM={t:"Tipo",s:"Sensibilidad",e:"Estado",o:"Responsable",y:"Año"};
const ok=(r,skip)=>Object.keys(F).every(k=>k==skip||!F[k].size||F[k].has(r[DIM[k]]));
const cnt=(skip,dim,cats,extra)=>cats.map(c=>D.filter(r=>ok(r,skip)&&r[DIM[dim]]==c&&(!extra||extra(r))).length);
function tog(k,v){F[k].has(v)?F[k].delete(v):F[k].add(v);draw()}
const al=(cols,k,cats)=>cols.map((c,i)=>!F[k].size||F[k].has(cats[i])?c:c+"44");
const ch={};
function mk(id,k,cfg,cats){cfg.options=Object.assign({maintainAspectRatio:false,animation:{duration:250},onClick:(e,el)=>{if(el.length)tog(k,cats[el[0].index])}},cfg.options);ch[id]=new Chart(document.getElementById(id),cfg)}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function draw(){
 Chart.defaults.color=css("--mu");Chart.defaults.borderColor=css("--grid");Chart.defaults.font.family='"Segoe UI","Helvetica Neue",Arial,sans-serif';
 Object.values(ch).forEach(c=>c.destroy());
 const ax={grid:{color:css("--grid")},ticks:{precision:0}},nog={grid:{display:false}};
 mk("ct","t",{type:"bar",data:{labels:T,datasets:[{data:cnt("t","t",T),backgroundColor:al(CT,"t",T)}]},options:{plugins:{legend:{display:false}},scales:{y:ax,x:nog}}},T);
 mk("cs","s",{type:"doughnut",data:{labels:S,datasets:[{data:cnt("s","s",S),backgroundColor:al(CS,"s",S),borderColor:css("--card")}]},options:{cutout:"55%",plugins:{legend:{position:"bottom"}}}},S);
 mk("ce","e",{type:"doughnut",data:{labels:E,datasets:[{data:cnt("e","e",E),backgroundColor:al(CE,"e",E),borderColor:css("--card")}]},options:{cutout:"55%",plugins:{legend:{position:"bottom"}}}},E);
 mk("co","o",{type:"bar",data:{labels:O,datasets:[{data:cnt("o","o",O),backgroundColor:al(O.map(()=>"#4e79a7"),"o",O)}]},options:{indexAxis:"y",plugins:{legend:{display:false}},scales:{x:ax,y:nog}}},O);
 mk("cy","y",{type:"bar",data:{labels:Y,datasets:T.map((t,i)=>({label:t,backgroundColor:Y.map(y=>!F.y.size||F.y.has(y)?CT[i]:CT[i]+"44"),data:Y.map(y=>D.filter(r=>ok(r,"y")&&r[4]==y&&r[0]==t).length)}))},options:{plugins:{legend:{position:"bottom"}},scales:{x:Object.assign({stacked:true},nog),y:Object.assign({stacked:true},ax)}}},Y);

 T.forEach(t=>{h+="<tr><td>"+t+"</td>"+S.map(s=>{const v=R.filter(r=>r[0]==t&&r[1]==s).length;return '<td style="background:rgba(78,121,167,'+(v?0.12+v/12*0.8:0)+');color:'+(v>6?"#fff":"inherit")+'">'+(v||"")+"</td>"}).join("")+"</tr>"});

rst.onclick=()=>{Object.values(F).forEach(s=>s.clear());draw()};

draw();
</script></body></html>
