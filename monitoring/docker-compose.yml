# Stack de monitoreo del Área de Big Data y Analítica (Prometheus + Blackbox + Node exporter).
# Uso:  docker compose up -d   ->  Prometheus en http://localhost:9090
services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
  node-exporter:
    image: prom/node-exporter:latest
    ports: ["9100:9100"]
  blackbox:
    image: prom/blackbox-exporter:latest
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports: ["9115:9115"]
