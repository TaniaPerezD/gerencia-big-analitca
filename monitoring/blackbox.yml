modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      # Igual que el panel del sitio: cualquier respuesta menor a 500 cuenta como «responde».
      valid_status_codes: [200, 201, 202, 203, 204, 206, 301, 302, 304, 307, 308, 400, 401, 403, 404, 405, 429]
      follow_redirects: true
