global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: equipo
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: servicios
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["https://www.axsbolivia.com"]
        labels: { servicio: "Internet AXS (fibra)" }
      - targets: ["https://www.entel.bo"]
        labels: { servicio: "Internet Entel (fibra)" }
      - targets: ["https://www.starlink.com"]
        labels: { servicio: "Starlink (respaldo)" }
      - targets: ["https://iatech-co-frontend.vercel.app"]
        labels: { servicio: "Sistema de Inventario" }
      - targets: ["https://www.tableau.com"]
        labels: { servicio: "Tableau (licencias)" }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
